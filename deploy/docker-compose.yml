# Plantilla para el servidor: copiar a /opt/olympuscourier-web/docker-compose.yml
services:
  web:
    image: ghcr.io/atmosferasoltec/olympuscourier-web:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3010:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
