<div class="adm-dialog">
  <div>
    <h2 class="adm-dialog-title">{{ data ? 'Editar vehículo' : 'Agregar vehículo' }}</h2>
    <p class="adm-dialog-sub">Tipos de vehículo disponibles para el reparto.</p>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="guardar()" class="flex flex-col gap-5">
    <div class="adm-field">
      <label class="adm-label" for="nombre">Nombre</label>
      <input id="nombre" class="adm-input" type="text" placeholder="Ingrese el tipo de vehículo" formControlName="nombre" autocomplete="off" />
      @if (formulario.get('nombre')?.touched && formulario.get('nombre')?.hasError('required')) {
      <span class="adm-error">Campo obligatorio</span>
      }
    </div>

    <div class="adm-dialog-actions">
      <button type="button" class="adm-btn adm-btn-ghost" (click)="closeDialog()">Cancelar</button>
      <button type="submit" class="adm-btn adm-btn-primary">Guardar</button>
    </div>
  </form>
</div>
