<div class="adm-toolbar">
  <app-estado-filter [value]="estado.value" (valueChange)="filtrar($event)" />
  <button type="button" (click)="openDialog()" class="adm-btn adm-btn-primary">
    <mat-icon>add</mat-icon>
    Añadir vehículo
  </button>
</div>

<div class="adm-card overflow-x-auto">
  <table class="adm-table min-w-[420px]">
    <thead>
      <tr>
        <th scope="col">Detalle</th>
        <th scope="col">Estado</th>
        <th scope="col" class="adm-col-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @if (isLoading()) {
        @for (i of skeleton; track i) {
        <tr>
          <td>
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-lg adm-skeleton"></div>
              <div class="w-44 adm-skeleton"></div>
            </div>
          </td>
          <td><div class="w-16 adm-skeleton"></div></td>
          <td></td>
        </tr>
        }
      } @else {
        @for (item of listVehiculos(); track item.id) {
        <tr>
          <td>
            <div class="flex items-center gap-3">
              <span class="adm-icon-tile"><mat-icon>local_shipping</mat-icon></span>
              <span class="adm-cell-main">{{ item.nombre | titlecase }}</span>
            </div>
          </td>
          <td><span class="adm-status adm-status-{{ item.activo }}">{{ item.activo | mostrarActivo }}</span></td>
          <td class="adm-col-end">
            <div class="adm-actions">
              @if (item.activo === 'S') {
              <button class="adm-icon-btn" matTooltip="Editar" aria-label="Editar" (click)="openDialog(item)">
                <mat-icon>edit</mat-icon>
              </button>
              <button class="adm-icon-btn danger" matTooltip="Eliminar" aria-label="Eliminar" (click)="setEstado(item, 'N')">
                <mat-icon>delete_outline</mat-icon>
              </button>
              } @else {
              <button class="adm-icon-btn success" matTooltip="Restaurar" aria-label="Restaurar" (click)="setEstado(item, 'S')">
                <mat-icon>restart_alt</mat-icon>
              </button>
              }
            </div>
          </td>
        </tr>
        } @empty {
        <tr>
          <td colspan="3">
            <div class="adm-empty">
              <mat-icon>no_crash</mat-icon>
              Sin vehículos
            </div>
          </td>
        </tr>
        }
      }
    </tbody>
  </table>
</div>
