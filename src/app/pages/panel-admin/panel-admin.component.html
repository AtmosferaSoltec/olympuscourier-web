<header class="adm-header">
  <h1 class="adm-title">Panel Administrativo</h1>
  <p class="adm-subtitle">Gestiona usuarios, distritos, métodos de pago y vehículos.</p>
</header>

<nav #nav class="adm-tabs" aria-label="Secciones del panel">
  @if (indicator(); as ind) {
  <span class="adm-tab-indicator" [class.no-anim]="!animar()"
    [style.width.px]="ind.w" [style.height.px]="ind.h"
    [style.transform]="'translate(' + ind.x + 'px,' + ind.y + 'px)'"></span>
  }
  @for (item of data; track item.url) {
  <a [routerLink]="['/menu', 'panel-admin', item.url]" routerLinkActive="active" class="adm-tab">
    <mat-icon>{{ item.icon }}</mat-icon>
    {{ item.label }}
  </a>
  }
</nav>

<router-outlet></router-outlet>
